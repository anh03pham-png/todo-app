<!doctype html>
<html>
  <head>
    <title>Todo App</title>
  </head>
  <body>
    <h1>My Todo App</h1>
    <p>Manage your tasks powerfully and effectively.</p>
    <p>Manage your tasks simply and easily.</p>

    <section>
      <h2>Tasks</h2>
      <ul>
        <li>Learn Git</li>
        <li>Complete homework</li>
        <li>Practice programming</li>
      </ul>
    </section>

    <form>
      <h2>Add New Task</h2>
      <input type="text" placeholder="Enter your task" />
      <button type="submit">Add Task</button>
    </form>
  </body>
</html>
